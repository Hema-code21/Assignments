<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <form>
        <h1>Student Registration Form</h1>
        <div class="space"> </div>
         <label for="roll no">Roll Number:</label>
         <input type="number" id="roll no" name="roll no">
         <div class="space"> </div>
         <label for="name">Student name</label>
         <input type="text" id="name" name="name">
         <div class="space"> </div>
          <label for="name">Father's name</label>
         <input type="text" id="name" name="name">
         <div class="space"> </div>
         <label for="Date of birth">Date of Birth:</label>
         <input type="date" id="Date of birth" name="Date of birth">
         <div class="space"> </div>
         <label for="mobile no">Mobile no. :</label>
         <input type="number" id="mobile no" name="mobile no">
         <div class="space"> </div>
         <label for="email">Email id:</label>
         <input type="email" id="email" name="email">
         <div class="space"> </div>
         <label for="password">Password:</label>
         <input type="password" id="password" name="password">
         <div class="space"> </div>
         <label for="gender">Gender:</label>
          <input type="radio" id="Male" name="gender" value="male">
          <label for="Male">Male</label>
          <input type="radio" id="Female" name="gender" value="female">
          <label for="Female">Female</label>
          <div class="space"> </div>
          <label for="department">Department:</label>
          <input type="radio" id="cse" name="department" value="cse">
          <label for="cse">CSE</label>
          <input type="radio" id="it" name="department" value="it">
          <label for="it">IT</label>    
           
            <div class="space"> </div>
            <label for="Course">Course:</label>
            <select id="Course" name="Course">
                <option value="B.Tech">B.Tech</option>
                <option value="M.Tech">M.Tech</option>
                <option value="MBA">MBA</option>
                <option value="MCA">MCA</option>
            </select>
            <div class="space"></div>
            <label for="photo">Student Photo:</label>
            <input type="file" id="photo" name="photo">
            <div class="space"></div>
            <label for="city">City:</label>
            <input type="text" id="city" name="city">
            <div class="space"></div>
            <label for="address">Address:</label>
            <textarea id="address" name="address"></textarea>
            <div class="space"></div>
            <input type="submit" value="Submit">
       </form>
</body>
</html>
